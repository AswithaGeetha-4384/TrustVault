{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Create folder</h1>
        <p>Organize private documents by project, team, or team member.</p>
    </div>
</div>

<div class="panel mx-auto" style="max-width: 760px;">
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Create folder</button>
        </form>
    </div>
</div>
{% endblock %}
