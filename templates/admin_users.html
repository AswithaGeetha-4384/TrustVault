{% extends 'base.html' %}
{% block content %}
<h2>User administration</h2>
<form method="post">
  {% csrf_token %}
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>
            <select name="role_{{ user.pk }}" class="form-select">
              {% for role_key, role_label in user.ROLE_CHOICES %}
                <option value="{{ role_key }}" {% if user.role == role_key %}selected{% endif %}>{{ role_label }}</option>
              {% endfor %}
            </select>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <button class="btn btn-primary" type="submit">Save role changes</button>
</form>
{% endblock %}
